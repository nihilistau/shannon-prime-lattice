<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#9aa4b2"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#3fb37f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="760" fill="#0d1117"/>

  <!-- Header -->
  <text x="32" y="44" fill="#e6edf3" font-size="26" font-weight="700">Speculative decoding in Shannon-Prime</text>
  <text x="32" y="70" fill="#9aa4b2" font-size="15">The Gemini graft (reject) vs the path that is already proven (reuse) — verify is byte-exact, so the draft may be approximate.</text>
  <line x1="32" y1="86" x2="1008" y2="86" stroke="#222b36" stroke-width="1"/>

  <!-- ===================== LEFT: REJECT ===================== -->
  <rect x="28" y="104" width="476" height="486" rx="10" fill="#16101200" stroke="#8b3a3a" stroke-width="1.5"/>
  <rect x="28" y="104" width="476" height="34" rx="10" fill="#2a1416"/>
  <text x="46" y="126" fill="#ff8a8a" font-size="16" font-weight="700">✗  Gemini's graft — REJECT</text>

  <!-- flow boxes -->
  <rect x="52" y="156" width="190" height="52" rx="8" fill="#161b22" stroke="#3a4452"/>
  <text x="147" y="180" fill="#cdd6e0" font-size="13" text-anchor="middle">Draft block T1…T8</text>
  <text x="147" y="198" fill="#7d8794" font-size="11" text-anchor="middle">(parallel, DFlash-style)</text>

  <line x1="147" y1="208" x2="147" y2="236" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="52" y="238" width="400" height="62" rx="8" fill="#1d1316" stroke="#8b3a3a"/>
  <text x="252" y="262" fill="#ff9d9d" font-size="13" text-anchor="middle" font-weight="600">"Poncelet / Euler confidence oracle"</text>
  <text x="252" y="282" fill="#c9a7a7" font-size="12" text-anchor="middle">Legendre symbol:  rhs^((q₁−1)/2) mod q₁  →  ±1</text>

  <line x1="252" y1="300" x2="252" y2="326" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="120" y="328" width="264" height="40" rx="8" fill="#161b22" stroke="#3a4452"/>
  <text x="252" y="353" fill="#cdd6e0" font-size="12.5" text-anchor="middle">probabilistic truncate the block</text>

  <!-- why broken -->
  <rect x="52" y="386" width="400" height="138" rx="8" fill="#21161800" stroke="#5e2b2b"/>
  <text x="68" y="408" fill="#ff8a8a" font-size="12.5" font-weight="700">Why it fails (math):</text>
  <text x="68" y="429" fill="#cbb6b6" font-size="11.5">• QR is a ~50/50 coin — uncorrelated with token correctness,</text>
  <text x="80" y="445" fill="#cbb6b6" font-size="11.5">and binary/non-monotone (not even a graded confidence).</text>
  <text x="68" y="466" fill="#cbb6b6" font-size="11.5">• The −163 Legendre test classifies PRIME SPLITTING in O_K,</text>
  <text x="80" y="482" fill="#cbb6b6" font-size="11.5">not tokens (Theory §1.4) — category error.</text>
  <text x="68" y="503" fill="#cbb6b6" font-size="11.5">• Verify is already exact &amp; cheaper → a coin only HURTS.</text>
  <text x="68" y="519" fill="#ff8a8a" font-size="11.5" font-weight="700">KILL → G-PONCELET-CORR: predict ρ ≈ 0, file the negative.</text>

  <!-- secondary rejects -->
  <rect x="52" y="536" width="196" height="42" rx="8" fill="#161b22" stroke="#5e2b2b"/>
  <text x="150" y="556" fill="#d9b3b3" font-size="11" text-anchor="middle">KSTE as draft head ✗</text>
  <text x="150" y="571" fill="#8f7a7a" font-size="10" text-anchor="middle">order-invariant, can't generate</text>
  <rect x="256" y="536" width="196" height="42" rx="8" fill="#161b22" stroke="#5e2b2b"/>
  <text x="354" y="556" fill="#d9b3b3" font-size="11" text-anchor="middle">38TB→300GB "120×" ✗</text>
  <text x="354" y="571" fill="#8f7a7a" font-size="10" text-anchor="middle">conflates train-cache vs KV</text>

  <!-- ===================== RIGHT: REUSE ===================== -->
  <rect x="536" y="104" width="476" height="486" rx="10" fill="#0e1a1400" stroke="#2f7d57" stroke-width="1.5"/>
  <rect x="536" y="104" width="476" height="34" rx="10" fill="#10241a"/>
  <text x="554" y="126" fill="#7ee0ab" font-size="16" font-weight="700">✓  The proven path — REUSE + one new piece</text>

  <rect x="560" y="156" width="200" height="56" rx="8" fill="#13211a" stroke="#2f7d57"/>
  <text x="660" y="178" fill="#aef0c9" font-size="12.5" text-anchor="middle" font-weight="600">Draft source — NEW</text>
  <text x="660" y="196" fill="#8fb6a1" font-size="10.5" text-anchor="middle">DSpark hybrid: parallel pass</text>
  <text x="660" y="208" fill="#8fb6a1" font-size="10.5" text-anchor="middle">+ sequential correction</text>

  <line x1="660" y1="212" x2="660" y2="238" stroke="#3fb37f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <rect x="560" y="240" width="200" height="44" rx="8" fill="#161b22" stroke="#3a4452"/>
  <text x="660" y="262" fill="#cdd6e0" font-size="12.5" text-anchor="middle" font-weight="600">spec_step()  — PROVEN</text>
  <text x="660" y="277" fill="#7d8794" font-size="10.5" text-anchor="middle">engine spec.rs (dormant, wire it)</text>

  <line x1="660" y1="284" x2="660" y2="310" stroke="#3fb37f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <rect x="540" y="312" width="240" height="48" rx="8" fill="#161b22" stroke="#2f7d57"/>
  <text x="660" y="333" fill="#cdd6e0" font-size="12.5" text-anchor="middle" font-weight="600">verify: byte-exact argmax equality</text>
  <text x="660" y="349" fill="#7d8794" font-size="10.5" text-anchor="middle">Theorem T8 — not a probability, not geometry</text>

  <!-- branch -->
  <line x1="600" y1="360" x2="600" y2="384" stroke="#3fb37f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="724" y1="360" x2="724" y2="384" stroke="#3fb37f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <rect x="548" y="386" width="108" height="46" rx="8" fill="#13211a" stroke="#2f7d57"/>
  <text x="602" y="406" fill="#aef0c9" font-size="11.5" text-anchor="middle">accept →</text>
  <text x="602" y="422" fill="#8fb6a1" font-size="10.5" text-anchor="middle">commit watermark</text>
  <rect x="668" y="386" width="120" height="46" rx="8" fill="#1b1614" stroke="#6b5a2f"/>
  <text x="728" y="406" fill="#e7d6a0" font-size="11.5" text-anchor="middle">reject →</text>
  <text x="728" y="422" fill="#bdae86" font-size="10" text-anchor="middle">sp_session_rewind O(1)</text>

  <!-- proven numbers -->
  <rect x="560" y="446" width="424" height="80" rx="8" fill="#0f1a1400" stroke="#2f5e48"/>
  <text x="576" y="467" fill="#7ee0ab" font-size="12" font-weight="700">Proven (engine b602ddf):</text>
  <text x="576" y="486" fill="#bcd6c8" font-size="11.5">2.67× fewer forward passes · bit_identical_to_greedy = 1 · T8.1 clean ℤ_q rollback</text>
  <text x="576" y="508" fill="#e7d6a0" font-size="11.5" font-weight="600">Binding constraint = draft ACCEPTANCE, not the loop</text>
  <text x="576" y="523" fill="#bdae86" font-size="11">(prompt-lookup draft nets 0.87× → that gap is the whole job, and DSpark fills it)</text>

  <!-- novel win -->
  <rect x="560" y="536" width="424" height="42" rx="8" fill="#10241a" stroke="#2f7d57"/>
  <text x="772" y="556" fill="#7ee0ab" font-size="11.5" text-anchor="middle" font-weight="700">Novel win: byte-exact cross-island speculation</text>
  <text x="772" y="571" fill="#8fb6a1" font-size="10.5" text-anchor="middle">edge-draft / server-verify = bit-identical logits → zero acceptance loss from float drift</text>

  <!-- ===================== FOOTER ===================== -->
  <rect x="28" y="606" width="984" height="124" rx="10" fill="#0f141b" stroke="#222b36"/>
  <text x="48" y="632" fill="#e6edf3" font-size="14" font-weight="700">Where it lives</text>
  <text x="48" y="656" fill="#9aa4b2" font-size="12.5">Loop + scheduler = orchestration POLICY → the Rust sp-daemon (L3).  Not math-core, not a CUDA kernel.</text>
  <text x="48" y="678" fill="#9aa4b2" font-size="12.5">Substrate = O_K = ℤ[(1+√−163)/2], dual-prime negacyclic CRT-NTT (q₁=1073738753, q₂=1073732609, M≈2⁶⁰).</text>
  <text x="48" y="700" fill="#9aa4b2" font-size="12.5">The container is exact (auditable, cross-machine-deterministic); that exactness is what lets the draft be fast/approximate</text>
  <text x="48" y="716" fill="#9aa4b2" font-size="12.5">and lets draft &amp; verify run on different silicon — the thing float speculative decoding structurally cannot do.</text>
</svg>
